name: Update cask.json

permissions:
  contents: write

on:
  push:
    paths:
      - .github/workflows/scheduled.yml
      - taps
  schedule:
    - cron: "*/60 * * * *"
  workflow_dispatch:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_BOOTSNAP: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  update:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false
          test-bot: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate cask.json
        run: |
          # Clean up
          rm -rf _data/cask
          mkdir -p _data/cask

          # Import taps
          . taps

          # Register and trust all the taps
          for i in "${TAPS[@]}"; do
            brew tap --force "${i}"
            brew trust "${i}"
          done

          brew update

          # Generate cask json files
          for i in "${TAPS[@]}"; do
            brew ruby ./generate-cask.rb ${i}
          done

          # Merge cask json files to a single json file
          jq -n '[inputs]' _data/cask/*.json > cask.json

      - name: Validate JSON
        run: jq empty cask.json

      - name: Push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'cask.json'
          message: 'chore: Update api output'
          default_author: github_actions
